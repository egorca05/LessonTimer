name: Build installers
on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  build:
    needs: interface
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            command: build:win
          - os: macos-15
            platform: macos
            arch: arm64
            command: build:mac
          - os: macos-15-intel
            platform: macos
            arch: x64
            command: build:mac:intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release ref matches package version
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
        shell: bash
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME.replace(/^release\//, '')) process.exit(1)"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: LessonTimer-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/LessonTimer-*.exe
            dist/LessonTimer-*.dmg
            dist/LessonTimer-*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: node scripts/checksums.cjs release
      - name: Publish release branch or prepare tag draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--draft --verify-tag)
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            TAG="${TAG#release/}"
            args=(--target "$GITHUB_SHA")
          fi
          mapfile -d '' assets < <(find release -maxdepth 1 -type f -print0)
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$state" = true || { echo 'Release already published; keeping its existing files.'; exit 0; }
            gh release upload "$TAG" "${assets[@]}" --clobber
            if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
              gh release edit "$TAG" --draft=false
            fi
          else
            gh release create "$TAG" "${assets[@]}" "${args[@]}" --title "LessonTimer $TAG" --notes-file docs/RELEASE_NOTES.md
          fi
